[auto_quest_start]
; 总开关：1 = 启用；0 = 完全停用，不安装 hook，也不修改游戏内存。
; 修改后需要重启游戏。
enabled=1

; 仅加速标题：1 = 跳过已识别的固定等待，完整保留加载，手动选择存档。
; 此时不自动进入任务，rehook_on_return/save_slot/quest_id 不影响游戏选择。
; 0 = 使用自动启动与资源裁剪，去向由 title_only_hub 决定。
title_screen_only=0

; 自动进入集会：1 = 自动选择 save_slot、正常建房并进入原生据点/集会区域。
; 按所选存档的开始区域设置进入；剧情限制仍由游戏原生流程决定。
; 保留等待缩短、资源提前加载与资源裁剪；不应用任务跳转，quest_id 无效。
; title_screen_only=1 优先于此项。两个模式均为 0 时自动进入指定任务。
title_only_hub=1

; 再次回到标题后，手动选择存档是否仍进入 quest_id 指定的任务。
; 1 = 回到标题页面后选择存档仍然进入任务，永堕虚黑城火烧地狱
; 0 = 恢复原生存档入口，正常进入据点/集会区域。
; 不会在返回标题后自动替你选择存档。标题/集会模式启用时不重定向任务。
rehook_on_return=0

; 存档槽位：0 / 1 / 2，对应游戏内的三个存档位。
; 只使用指定槽位，不会自动切换到其他存档；空槽不会自动开始游戏。
save_slot=0

; 游戏启动后自动接受的任务 ID，默认 66845 = 传说中的黑龙。
; 任务 ID 请查阅随附的 quest_id.csv。
quest_id=66845
